services:
  bocchi:
    image: yaroslavgrud/bocchi-downloader-server-edition:latest
    container_name: bocchi-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - BOT_MODE=${BOT_MODE:-stable}
    volumes:
      - ./data:/app/data
      - type: tmpfs
        target: /tmp
      - type: tmpfs
        target: /var/tmp
    read_only: true
    security_opt:
      - no-new-privileges:true