name: "Полный анализ безопасности (единый файл)"

on:
  workflow_dispatch:   # ручной запуск по кнопке
  schedule:
    - cron: '0 4 * * 1'  # еженедельно (можно убрать или оставить)

permissions:
  contents: read
  security-events: write

jobs:
  # ===================== CodeQL (Python) =====================
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: +security-extended,security-and-quality

      - name: Анализ CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  # ===================== Semgrep (все языки) =====================
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Запуск Semgrep
        continue-on-error: true        # не останавливать воркфлоу при exit code 1
        run: |
          semgrep ci \
            --config=auto \
            --sarif \
            --output=semgrep.sarif \
            --verbose                   # покажет детали, почему может падать

      - name: Загрузка SARIF в GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif