name: "Полный анализ безопасности (CodeQL + Semgrep)"

on:
  workflow_dispatch:   # ручной запуск по кнопке
  schedule:
    - cron: '0 4 * * 1'  # раз в неделю (можно удалить)

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@v4   # обновлено до v4
        with:
          languages: python
          queries: +security-extended,security-and-quality

      - name: Выполнить анализ
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Запуск Semgrep
        run: |
          semgrep ci \
            --config=auto \
            --sarif \
            --output=semgrep.sarif \
            --no-suppress-errors

      - name: Загрузка в GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
