name: "Полный анализ безопасности и качества"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Инициализация CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          languages: python
          queries: +security-extended,security-and-quality
      - name: Анализ CodeQL
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          category: "/language:python"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Запуск Semgrep
        continue-on-error: true
        run: |
          semgrep ci \
            --config=auto \
            --sarif \
            --output=semgrep.sarif \
            --verbose \
            || true
          if [ ! -f semgrep.sarif ]; then
            echo '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[]}' > semgrep.sarif
          fi
      - name: Загрузка SARIF в GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          sarif_file: semgrep.sarif

  python-checks:
    name: Python анализ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Установка инструментов
        run: pip install pip-audit bandit flake8 vulture yamllint

      - name: Аудит зависимостей (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Поиск мёртвого кода (vulture)
        continue-on-error: true
        run: vulture . --min-confidence 80 || true

      - name: Линтер стиля (flake8)
        continue-on-error: true
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

      - name: Проверка безопасности кода (bandit)
        continue-on-error: true
        run: bandit -r . -ll -f custom --exit-zero

      - name: Линтер YAML-файлов (yamllint)
        continue-on-error: true
        run: yamllint .

  dockerfile-lint:
    name: Линтинг Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  secrets-scan:
    name: Поиск секретов (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  extra-checks:
    name: Лицензии и JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Проверка лицензий зависимостей
        continue-on-error: true
        run: |
          pip install pip-licenses
          pip-licenses --allow-only="MIT License;Apache License 2.0;BSD License;Python Software Foundation License;Mozilla Public License 2.0"
      - name: Валидация JSON файлов
        continue-on-error: true
        run: |
          for f in $(find . -name "*.json"); do
            python -m json.tool "$f" > /dev/null || echo "Invalid JSON: $f"
          done