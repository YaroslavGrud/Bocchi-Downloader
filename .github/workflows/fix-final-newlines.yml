name: "Добавить финальный перевод строки во все workflow"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-newlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Добавить newline в конце каждого YAML-файла
        run: |
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | while IFS= read -r -d '' file; do
            # Добавляем перевод строки только если его нет в конце
            if [ -s "$file" ] && [ "$(tail -c 1 "$file")" != "" ]; then
              echo "" >> "$file"
              echo "Добавлен newline: $file"
            fi
          done

      - name: Создать Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: "📄 Добавить final newline во все workflow"
          title: "📄 Финальные переводы строк во всех workflow-файлах"
          body: |
            Автоматическое добавление отсутствующего символа новой строки в конце каждого YAML-файла в `.github/workflows`.
            Исправляет ошибку yamllint: `new-line-at-end-of-file`.
          branch: fix/final-newlines-all
          delete-branch: true
          token: ${{ secrets.PAT_TOKEN }}
