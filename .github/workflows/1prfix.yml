name: 🤖 Copilot Autofix – Собрать готовые исправления в 1 PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  collect-commits-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_BRANCH: main

    steps:
      - name: 1. Получить все открытые CodeQL алерты
        id: list_alerts
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = await github.paginate(
              'GET /repos/{owner}/{repo}/code-scanning/alerts',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                tool_name: 'CodeQL',
                per_page: 100,
              }
            );

            const allNumbers = alerts.map(a => a.number);
            console.log(`Найдено ${allNumbers.length} открытых алертов`);
            core.exportVariable('ALL_ALERTS', allNumbers.join(','));

      - name: 2. Попытаться создать autofix-коммит для каждого
        id: create_commits
        if: env.ALL_ALERTS
        uses: actions/github-script@v7
        timeout-minutes: 25
        with:
          script: |
            const numbers = process.env.ALL_ALERTS.split(',');
            const branches = [];

            for (const num of numbers) {
              try {
                const response = await github.request(
                  'POST /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix/commits',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    alert_number: parseInt(num),
                  }
                );
                const branchRef = response.data.ref;   // например, refs/heads/autofix/...
                const shortBranch = branchRef.replace('refs/heads/', '');
                branches.push(shortBranch);
                console.log(`#${num}: ✅ коммит → ${shortBranch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  console.log(`#${num}: autofix недоступен (${error.status})`);
                } else {
                  console.error(`#${num}: ошибка – ${error.message}`);
                }
              }
              // Задержка 12 секунд, чтобы не превысить лимит (~5 запросов/мин)
              await new Promise(resolve => setTimeout(resolve, 12000));
            }

            console.log(`Успешно создано веток: ${branches.length}`);
            core.exportVariable('FIX_BRANCHES', branches.join(','));
            core.exportVariable('FIX_COUNT', branches.length.toString());

      - name: 3. Собрать все ветки в одну общую
        if: env.FIX_COUNT > 0
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const repoUrl = `https://x-access-token:${process.env.GITHUB_TOKEN}@github.com/${context.repo.owner}/${context.repo.repo}.git`;

            execSync('git config --global user.email "actions@github.com"');
            execSync('git config --global user.name "GitHub Actions"');

            const base = process.env.BASE_BRANCH;
            const mergeBranch = `autofix/combined-${Date.now()}`;

            execSync(`git clone ${repoUrl} repo`);
            process.chdir('repo');
            execSync(`git checkout ${base}`);
            execSync(`git checkout -b ${mergeBranch}`);

            const fixBranches = process.env.FIX_BRANCHES.split(',');
            for (const branch of fixBranches) {
              console.log(`Мержим ${branch}...`);
              try {
                execSync(`git fetch origin ${branch}`);
                execSync(`git merge origin/${branch} --no-ff -m "Merge autofix ${branch}"`);
              } catch (err) {
                console.error(`Конфликт при мерже ${branch}: ${err.message}`);
                execSync('git merge --abort');
              }
            }

            execSync(`git push origin ${mergeBranch}`);
            core.exportVariable('MERGE_BRANCH', mergeBranch);

      - name: 4. Создать общий Pull Request
        if: env.MERGE_BRANCH
        uses: actions/github-script@v7
        with:
          script: |
            const count = process.env.FIX_COUNT;
            const pr = await github.request('POST /repos/{owner}/{repo}/pulls', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Copilot Autofix: ${count} исправлений одним PR`,
              head: process.env.MERGE_BRANCH,
              base: process.env.BASE_BRANCH,
              body: `Объединены автоматические исправления для ${count} алертов.\n\nВетки: ${process.env.FIX_BRANCHES}`,
            });
            console.log(`✅ PR создан: ${pr.data.html_url}`);

      - name: 5. Удалить временные autofix-ветки (опционально)
        if: always() && env.FIX_BRANCHES
        uses: actions/github-script@v7
        with:
          script: |
            const branches = process.env.FIX_BRANCHES.split(',');
            for (const b of branches) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/git/refs/heads/{branch}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: b,
                });
                console.log(`Удалена ветка ${b}`);
              } catch (e) {
                console.warn(`Не удалось удалить ${b}: ${e.message}`);
              }
            }
