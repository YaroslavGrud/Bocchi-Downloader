name: "CodeQL — полный анализ"

on:
  push:
    branches: [ '**' ]          # все ветки при пуше
  pull_request:
    branches: [ '**' ]          # все PR (любые ветки)
  schedule:
    - cron: '0 2 * * 0'         # каждое воскресенье в 2:00 UTC
  workflow_dispatch:            # ручной запуск из интерфейса GitHub

jobs:
  analyze:
    name: Анализ (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Запуск анализа CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          upload: always
