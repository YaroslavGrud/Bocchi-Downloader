name: Copilot Autofix — Единый PR для всех алертов

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  batch-autofix-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # запас времени на медленные запросы

    steps:
      - name: 1. Получить список открытых алертов CodeQL
        id: list_alerts
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = await github.paginate(
              'GET /repos/{owner}/{repo}/code-scanning/alerts',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                tool_name: 'CodeQL',
                per_page: 100,
              }
            );
            
            const alertsToFix = alerts.filter(a => a.fixed_at === null && a.autofix?.status !== 'fixed');
            
            console.log(`Найдено ${alertsToFix.length} алертов для обработки.`);
            
            core.exportVariable('ALERT_NUMBERS', alertsToFix.map(a => a.number).join(','));
            core.exportVariable('ALERT_COUNT', alertsToFix.length.toString());

      - name: 2. Запустить генерацию Autofix для каждого алерта (с контролем лимита)
        if: env.ALERT_COUNT > 0
        uses: actions/github-script@v7
        timeout-minutes: 45   # 91 * 8 сек = ~12 мин, запас для повторов
        with:
          script: |
            const numbers = process.env.ALERT_NUMBERS.split(',');
            console.log(`Запрашиваем autofix для ${numbers.length} алертов с паузой 8 сек...`);
            
            for (const num of numbers) {
              let success = false;
              while (!success) {
                try {
                  const response = await github.request(
                    'POST /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix',
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      alert_number: parseInt(num),
                    }
                  );
                  console.log(`Алерт #${num}: ${response.status}`);
                  success = true;
                } catch (error) {
                  if (error.message.includes('API rate limit exceeded')) {
                    console.warn(`Rate limit для #${num}, ждём 60 секунд...`);
                    await new Promise(resolve => setTimeout(resolve, 60000));
                    // повторяем попытку для этого же алерта
                  } else {
                    console.error(`Ошибка при запросе autofix для алерта #${num}: ${error.message}`);
                    success = true; // не зацикливаемся на других ошибках
                  }
                }
              }
              // Задержка 8 секунд между запросами (чтобы уложиться в ~7 запросов/мин)
              await new Promise(resolve => setTimeout(resolve, 8000));
            }

      - name: 3. Ожидание готовности всех исправлений
        if: env.ALERT_COUNT > 0
        uses: actions/github-script@v7
        id: wait_for_fixes
        timeout-minutes: 30
        with:
          script: |
            const numbers = process.env.ALERT_NUMBERS.split(',');
            const maxAttempts = 20;
            const delaySeconds = 30;
            
            let allReady = false;
            let attempts = 0;
            let alertStatuses = {};
            numbers.forEach(n => alertStatuses[n] = 'pending');
            
            console.log(`Ожидаем готовности ${numbers.length} исправлений...`);
            
            while (!allReady && attempts < maxAttempts) {
              attempts++;
              console.log(`\nПроверка статусов (шаг ${attempts}/${maxAttempts})...`);
              allReady = true;
              
              for (const num of numbers) {
                if (alertStatuses[num] === 'generated' || alertStatuses[num] === 'skipped') continue;
                
                try {
                  const response = await github.request(
                    'GET /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix',
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      alert_number: parseInt(num),
                    }
                  );
                  const data = response.data;
                  const status = data.status;
                  console.log(`Алерт #${num}: статус = ${status}`);
                  
                  // Готово, если статус "generated", "success" или есть fix.diff
                  if (status === 'generated' || status === 'success' || (data.fix && data.fix.diff)) {
                    alertStatuses[num] = 'generated';
                  } else if (status === 'failed' || status === 'unavailable' || status === 'outdated') {
                    console.log(`Исправление для алерта #${num} недоступно (${status}). Пропускаем.`);
                    alertStatuses[num] = 'skipped';
                  } else {
                    allReady = false;
                  }
                } catch (error) {
                  console.error(`Ошибка проверки статуса для #${num}: ${error.message}`);
                  alertStatuses[num] = 'skipped';
                }
              }
              
              if (!allReady) {
                console.log(`Ждем ${delaySeconds} секунд до следующей проверки...`);
                await new Promise(resolve => setTimeout(resolve, delaySeconds * 1000));
              }
            }
            
            if (!allReady) {
              console.warn('Превышено время ожидания. Продолжим с теми исправлениями, что готовы.');
            }
            
            const readyAlerts = Object.entries(alertStatuses)
              .filter(([num, status]) => status === 'generated')
              .map(([num]) => num);
            
            console.log(`\nГотово исправлений: ${readyAlerts.length}`);
            core.exportVariable('READY_ALERTS', readyAlerts.join(','));

      - name: 4. Применить исправления и создать единый PR
        if: env.READY_ALERTS && env.READY_ALERTS != ''
        uses: actions/github-script@v7
        with:
          script: |
            const numbers = process.env.READY_ALERTS.split(',');
            if (numbers.length === 0) {
              console.log('Нет готовых исправлений. Завершаем работу.');
              return;
            }
            
            console.log(`Применяем исправления для ${numbers.length} алертов...`);
            
            const { execSync } = require('child_process');
            const repoUrl = `https://${process.env.GITHUB_ACTOR}:${process.env.GITHUB_TOKEN}@github.com/${context.repo.owner}/${context.repo.repo}.git`;
            
            execSync('git config --global user.email "actions@github.com"');
            execSync('git config --global user.name "GitHub Actions"');
            
            const branchName = `autofix/batch-${new Date().toISOString().slice(0,10).replace(/-/g,'')}`;
            
            execSync(`git clone ${repoUrl} repo`);
            process.chdir('repo');
            execSync(`git checkout -b ${branchName}`);
            
            let appliedCount = 0;
            for (const num of numbers) {
              try {
                console.log(`Получение и применение исправления для алерта #${num}...`);
                
                const autofix = await github.request(
                  'GET /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    alert_number: parseInt(num),
                  }
                );
                
                const fix = autofix.data.fix;
                if (!fix || !fix.diff) {
                  console.log(`Нет diff-файла для алерта #${num}. Пропускаем.`);
                  continue;
                }
                
                const fs = require('fs');
                fs.writeFileSync(`/tmp/fix-${num}.patch`, fix.diff);
                
                try {
                  execSync(`git apply /tmp/fix-${num}.patch`);
                  appliedCount++;
                  console.log(`Исправление для алерта #${num} успешно применено.`);
                } catch (applyError) {
                  console.error(`Ошибка применения патча для алерта #${num}: ${applyError.message}. Пробуем применить с флагом --reject...`);
                  try {
                    execSync(`git apply --reject /tmp/fix-${num}.patch`);
                    appliedCount++;
                    console.log(`Исправление для алерта #${num} применено с --reject.`);
                  } catch (rejectError) {
                    console.error(`Не удалось применить патч для алерта #${num} даже с --reject. Пропускаем.`);
                  }
                }
              } catch (error) {
                console.error(`Ошибка обработки алерта #${num}: ${error.message}`);
              }
            }
            
            console.log(`\nВсего применено исправлений: ${appliedCount}`);
            
            if (appliedCount === 0) {
              console.log('Нет применённых исправлений. Завершаем работу.');
              return;
            }
            
            execSync('git add -A');
            execSync(`git commit -m "Copilot Autofix: исправления для ${appliedCount} алертов"`);
            execSync(`git push origin ${branchName}`);
            
            const pr = await github.request('POST /repos/{owner}/{repo}/pulls', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Copilot Autofix: исправление ${appliedCount} алертов`,
              head: branchName,
              base: 'main',
              body: `Этот Pull Request содержит автоматические исправления для следующих алертов CodeQL:\n\n${
                numbers.map(n => `- [Алерт #${n}](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning/${n})`).join('\n')
              }\n\nПожалуйста, проверьте изменения перед мержем.`,
            });
            
            console.log(`Pull Request создан: ${pr.data.html_url}`);
