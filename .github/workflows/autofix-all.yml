name: Apply all Copilot Autofix suggestions

on:
  workflow_dispatch:  # ручной запуск по кнопке
  schedule:
    - cron: '0 3 * * 1'  # каждый понедельник в 3:00 UTC (по желанию)

permissions:
  contents: write        # для создания ветки и коммита
  pull-requests: write   # для создания PR
  security-events: read  # для чтения алертов

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Copilot Autofix
        id: autofix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Получить все открытые алерты CodeQL
            const alerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              {
                owner,
                repo,
                state: 'open',
                tool_name: 'CodeQL',
                per_page: 100,
              }
            );

            core.info(`Found ${alerts.length} open CodeQL alerts`);

            // 2. Отобрать только те, у которых есть autofix
            const autofixAlerts = alerts.filter(alert => {
              // Проверяем, есть ли autofix в самом алерте
              // Обычно наличие autofix указано в alert.most_recent_instance?.autofix
              const autofix = alert.most_recent_instance?.autofix;
              return !!autofix;
            });

            if (autofixAlerts.length === 0) {
              core.info('No alerts with available autofix. Exiting.');
              return;
            }

            core.info(`${autofixAlerts.length} alerts have autofix suggestions`);

            // 3. Создаём новую ветку от HEAD
            const branchName = `autofix/copilot-${Date.now()}`;
            const baseRef = context.ref.replace('refs/heads/', ''); // текущая ветка по умолчанию main/master
            // Получаем SHA последнего коммита
            const baseBranch = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${baseRef}`,
            });
            const baseSha = baseBranch.data.object.sha;
            // Создаём ветку
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branchName}`,
              sha: baseSha,
            });

            // 4. Применяем исправления для каждого алерта
            //    Используем endpoint: GET /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix
            //    Он возвращает diff, который можно применить через git apply
            for (const alert of autofixAlerts) {
              const alertNumber = alert.number;
              core.info(`Processing alert #${alertNumber}`);
              const autofixData = await github.rest.codeScanning.getAutofix({
                owner,
                repo,
                alert_number: alertNumber,
              });
              // autofixData.data содержит фикс в виде набора изменений
              // Структура: { status: 'available', fix: { description, ... }, diff }
              // Возможно, есть поле data.diff?
              // Документация: https://docs.github.com/en/rest/code-scanning/code-scanning#get-an-autofix-for-a-code-scanning-alert
              const diff = autofixData.data.diff;
              if (!diff) {
                core.warning(`Alert #${alertNumber} has autofix but no diff returned`);
                continue;
              }

              // Записываем diff во временный файл и применяем
              const fs = require('fs');
              const diffPath = `/tmp/autofix_${alertNumber}.patch`;
              fs.writeFileSync(diffPath, diff);
              // Используем exec для git apply
              const { execSync } = require('child_process');
              execSync(`git apply --verbose ${diffPath}`, { stdio: 'inherit' });
            }

            // 5. Коммитим и пушим изменения
            const { execSync } = require('child_process');
            execSync(`git config user.name "github-actions[bot]"`, { stdio: 'inherit' });
            execSync(`git config user.email "github-actions[bot]@users.noreply.github.com"`, { stdio: 'inherit' });
            execSync(`git add -A`, { stdio: 'inherit' });
            const status = execSync(`git status --porcelain`).toString();
            if (!status) {
              core.info('No changes to commit after applying autofixes');
              return;
            }
            execSync(`git commit -m "Apply Copilot Autofix to ${autofixAlerts.length} alert(s)"`, { stdio: 'inherit' });
            execSync(`git push origin ${branchName}`, { stdio: 'inherit' });

            // 6. Создаём Pull Request
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `🔧 Copilot Autofix: fix ${autofixAlerts.length} code scanning alert(s)`,
              head: branchName,
              base: baseRef,
              body: `Автоматическое исправление открытых CodeQL-алертов.\nИсправлено:\n${autofixAlerts.map(a => `- #${a.number}: ${a.rule.description}`).join('\n')}`,
            });

            core.info(`Pull request created: ${pr.data.html_url}`);
