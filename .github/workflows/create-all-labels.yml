name: Create missing labels from whole repo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/**'
      - 'dependabot.yml'
      - '**.yml'
      - '**.yaml'
      - '**.md'

permissions:
  contents: read
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Debug - List all YAML and Markdown files
        run: |
          echo "=== Listing all .yml and .yaml files ==="
          find . -type f \( -name "*.yml" -o -name "*.yaml" \) | sort
          echo "=== Listing all .md files ==="
          find . -type f -name "*.md" | sort

      - name: Scan repository and create missing labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          import os, re, yaml, subprocess, sys, glob

          # ------------------------------------------------------------
          # Настройте описания и цвета для конкретных ярлыков
          LABEL_INFO = {
              "dependencies": {
                  "color": "ededed",
                  "description": "Pull requests that update a dependency file"
              },
              "python": {
                  "color": "2b67c6",
                  "description": "Pull requests that update Python packages"
              },
              "github-actions": {
                  "color": "00008b",
                  "description": "Pull requests that update GitHub Actions workflows"
              },
              "docker": {
                  "color": "384d54",
                  "description": "Pull requests that update Docker images or Dockerfiles"
              }
          }
          # ------------------------------------------------------------

          def is_badge(text: str) -> bool:
              patterns = [r'shields\.io', r'img\.shields\.io', r'badge', r'\.svg', r'http']
              return any(re.search(p, text, re.IGNORECASE) for p in patterns)

          def extract_labels_from_yaml(content: str, source: str):
              labels = set()
              try:
                  data = yaml.safe_load(content)
                  if not data:
                      print(f"  ⚠️ Empty or invalid YAML in {source}")
                      return labels
                  def walk(obj, path=""):
                      if isinstance(obj, dict):
                          if 'labels' in obj:
                              vals = obj['labels']
                              if isinstance(vals, list):
                                  for v in vals:
                                      if isinstance(v, str) and not is_badge(v):
                                          labels.add(v.strip())
                          for k, v in obj.items():
                              walk(v, f"{path}.{k}")
                      elif isinstance(obj, list):
                          for i, v in enumerate(obj):
                              walk(v, f"{path}[{i}]")
                  walk(data)
              except yaml.YAMLError as e:
                  print(f"  ❌ YAML parse error in {source}: {e}")
              return labels

          def extract_labels_from_md(content: str, source: str):
              labels = set()
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if match:
                  yaml_part = match.group(1)
                  labels = extract_labels_from_yaml(yaml_part, source)
              return labels

          all_labels = set()
          files_processed = 0

          # Use glob for more reliable file discovery
          yaml_files = glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)
          md_files = glob.glob('**/*.md', recursive=True)
          
          print(f"Found {len(yaml_files)} YAML files and {len(md_files)} Markdown files.")
          
          # Process YAML files
          for filepath in yaml_files:
              if '.git' in filepath.split(os.sep):
                  continue
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  found_here = extract_labels_from_yaml(content, filepath)
                  if found_here:
                      print(f"📄 {filepath} -> {found_here}")
                      all_labels.update(found_here)
                      files_processed += 1
                  else:
                      # Only print for .github/ files to reduce noise
                      if '.github' in filepath:
                          print(f"🔍 {filepath}: No labels found (but file exists)")
              except Exception as e:
                  print(f"❌ Error reading {filepath}: {e}")

          # Process Markdown files (excluding README etc.)
          for filepath in md_files:
              if '.git' in filepath.split(os.sep):
                  continue
              filename = os.path.basename(filepath).lower()
              if filename in ['readme.md', 'readme_ru.md', 'changelog.md']:
                  continue
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  found_here = extract_labels_from_md(content, filepath)
                  if found_here:
                      print(f"📄 {filepath} -> {found_here}")
                      all_labels.update(found_here)
                      files_processed += 1
              except Exception as e:
                  print(f"❌ Error reading {filepath}: {e}")

          if not all_labels:
              print("❌ No labels found in any YAML/Markdown file.")
              print("👉 Проверьте, что в файлах есть ключ 'labels' (например, в .github/dependabot.yml).")
              sys.exit(0)

          print(f"\n✅ Total unique labels found: {all_labels}")
          print(f"   (from {files_processed} files)\n")

          repo = os.environ['REPO']
          for label in sorted(all_labels):
              result = subprocess.run(
                  ['gh', 'api', f'/repos/{repo}/labels/{label}'],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  info = LABEL_INFO.get(label, {"color": "ededed", "description": "Auto-created label"})
                  print(f"✨ Creating label: {label} (color: {info['color']}, desc: {info['description']})")
                  subprocess.run(
                      ['gh', 'api', f'/repos/{repo}/labels',
                       '-f', f'name={label}',
                       '-f', f'color={info["color"]}',
                       '-f', f'description={info["description"]}'],
                      check=True
                  )
              else:
                  print(f"✔️ Label already exists: {label}")
          print("\n🎉 All done!")
        shell: python
