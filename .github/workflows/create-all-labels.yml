name: Create missing labels from whole repo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/**'
      - 'dependabot.yml'
      - '**.yml'
      - '**.yaml'
      - '**.md'

permissions:
  contents: read
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Scan repository and create missing labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          import os, re, yaml, subprocess, sys

          # ------------------------------------------------------------
          # Настройте описания и цвета для конкретных ярлыков
          LABEL_INFO = {
              "dependencies": {
                  "color": "ededed",
                  "description": "Pull requests that update a dependency file"
              },
              "python": {
                  "color": "2b67c6",
                  "description": "Pull requests that update Python packages"
              },
              "github-actions": {
                  "color": "00008b",
                  "description": "Pull requests that update GitHub Actions workflows"
              },
              "docker": {
                  "color": "384d54",
                  "description": "Pull requests that update Docker images or Dockerfiles"
              }
          }
          # ------------------------------------------------------------

          def is_badge(text: str) -> bool:
              patterns = [r'shields\.io', r'img\.shields\.io', r'badge', r'\.svg', r'http']
              return any(re.search(p, text, re.IGNORECASE) for p in patterns)

          def extract_labels_from_yaml(content: str, source: str):
              labels = set()
              try:
                  data = yaml.safe_load(content)
                  if not data:
                      return labels
                  def walk(obj):
                      if isinstance(obj, dict):
                          if 'labels' in obj:
                              vals = obj['labels']
                              if isinstance(vals, list):
                                  for v in vals:
                                      if isinstance(v, str) and not is_badge(v):
                                          labels.add(v.strip())
                          for v in obj.values():
                              walk(v)
                      elif isinstance(obj, list):
                          for v in obj:
                              walk(v)
                  walk(data)
              except yaml.YAMLError:
                  print(f"  ⚠️ YAML parse error in {source}")
              return labels

          def extract_labels_from_md(content: str, source: str):
              labels = set()
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if match:
                  yaml_part = match.group(1)
                  labels = extract_labels_from_yaml(yaml_part, source)
              return labels

          all_labels = set()
          files_processed = 0

          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for file in files:
                  if file.lower().endswith(('.png', '.jpg', '.jpeg', '.gif', '.svg', '.ico', '.woff', '.woff2')):
                      continue
                  filepath = os.path.join(root, file)
                  try:
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                  except Exception:
                      continue

                  found_here = set()
                  if file.endswith(('.yml', '.yaml')):
                      found_here = extract_labels_from_yaml(content, filepath)
                      if found_here:
                          print(f"📄 {filepath} -> {found_here}")
                  elif file.endswith('.md'):
                      if file.lower() in ['readme.md', 'readme_ru.md', 'changelog.md']:
                          continue
                      found_here = extract_labels_from_md(content, filepath)
                      if found_here:
                          print(f"📄 {filepath} -> {found_here}")

                  if found_here:
                      all_labels.update(found_here)
                      files_processed += 1

          if not all_labels:
              print("❌ No labels found in any YAML/Markdown file.")
              print("👉 Проверьте, что в файлах есть ключ 'labels' (например, в .github/dependabot.yml).")
              sys.exit(0)

          print(f"\n✅ Total unique labels found: {all_labels}")
          print(f"   (from {files_processed} files)\n")

          repo = os.environ['REPO']
          for label in sorted(all_labels):
              result = subprocess.run(
                  ['gh', 'api', f'/repos/{repo}/labels/{label}'],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  info = LABEL_INFO.get(label, {"color": "ededed", "description": "Auto-created label"})
                  print(f"✨ Creating label: {label} (color: {info['color']}, desc: {info['description']})")
                  subprocess.run(
                      ['gh', 'api', f'/repos/{repo}/labels',
                       '-f', f'name={label}',
                       '-f', f'color={info["color"]}',
                       '-f', f'description={info["description"]}'],
                      check=True
                  )
              else:
                  print(f"✔️ Label already exists: {label}")
          print("\n🎉 All done!")
        shell: python
