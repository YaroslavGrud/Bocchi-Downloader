name: Create Labels from YAML/Markdown

on:
  push:
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.md'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find and create/update labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os, re, yaml, subprocess, sys, json

          LABEL_INFO = {
              "dependencies": {
                  "color": "ededed",
                  "description": "Pull requests that update project dependencies (pip, GitHub Actions, Docker, etc.)"
              },
              "python": {
                  "color": "2b67c6",
                  "description": "Pull requests that update Python packages or Python-related dependencies"
              },
              "github-actions": {
                  "color": "00008b",
                  "description": "Pull requests that update GitHub Actions workflows and actions"
              },
              "docker": {
                  "color": "384d54",
                  "description": "Pull requests that update Docker images, Dockerfiles, or container-related configurations"
              }
          }

          def is_badge(text):
              patterns = [r'shields\.io', r'img\.shields\.io', r'badge', r'\.svg', r'http']
              return any(re.search(p, text, re.IGNORECASE) for p in patterns)

          def extract_labels_from_yaml(content, source):
              labels = set()
              try:
                  data = yaml.safe_load(content)
                  if not data:
                      return labels
                  def walk(obj):
                      if isinstance(obj, dict):
                          if 'labels' in obj and isinstance(obj['labels'], list):
                              for v in obj['labels']:
                                  if isinstance(v, str) and not is_badge(v):
                                      labels.add(v.strip())
                          for v in obj.values():
                              walk(v)
                      elif isinstance(obj, list):
                          for v in obj:
                              walk(v)
                  walk(data)
              except Exception as e:
                  print(f"  ❌ YAML error in {source}: {e}")
              return labels

          def extract_labels_from_md(content, source):
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if match:
                  return extract_labels_from_yaml(match.group(1), source)
              return set()

          def find_files(extensions):
              matches = []
              for root, dirs, files in os.walk('.'):
                  if '.git' in root.split(os.sep):
                      continue
                  for file in files:
                      if any(file.endswith(ext) for ext in extensions):
                          matches.append(os.path.join(root, file))
              return matches

          yaml_files = find_files(['.yml', '.yaml'])
          md_files   = find_files(['.md'])

          print(f"Found {len(yaml_files)} YAML files and {len(md_files)} Markdown files.")
          all_labels = set()
          files_processed = 0

          for filepath in yaml_files:
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  found = extract_labels_from_yaml(content, filepath)
                  if found:
                      print(f"📄 {filepath} -> {found}")
                      all_labels.update(found)
                      files_processed += 1
              except Exception as e:
                  print(f"❌ Error reading {filepath}: {e}")

          for filepath in md_files:
              basename = os.path.basename(filepath).lower()
              if basename in ['readme.md', 'readme_ru.md', 'changelog.md']:
                  continue
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  found = extract_labels_from_md(content, filepath)
                  if found:
                      print(f"📄 {filepath} -> {found}")
                      all_labels.update(found)
                      files_processed += 1
              except Exception as e:
                  print(f"❌ Error reading {filepath}: {e}")

          if not all_labels:
              print("❌ No labels found in any YAML/Markdown file.")
              print("👉 Проверьте, что в файлах есть ключ 'labels' (например, в .github/dependabot.yml).")
              sys.exit(0)

          print(f"\n✅ Total unique labels found: {sorted(all_labels)}")
          print(f"   (from {files_processed} files)\n")

          repo = os.environ['REPO']
          for label in sorted(all_labels):
              # Проверяем, существует ли метка
              result = subprocess.run(['gh', 'api', f'/repos/{repo}/labels/{label}'], capture_output=True, text=True)
              if result.returncode != 0:
                  # Создаём новую метку
                  info = LABEL_INFO.get(label, {"color": "ededed", "description": "Auto-created label"})
                  print(f"✨ Creating label: {label} (color: {info['color']}, desc: {info['description']})")
                  subprocess.run(['gh', 'api', f'/repos/{repo}/labels',
                                  '-f', f'name={label}',
                                  '-f', f'color={info["color"]}',
                                  '-f', f'description={info["description"]}'], check=True)
              else:
                  # Метка существует — обновляем описание, если нужно
                  existing = json.loads(result.stdout)
                  info = LABEL_INFO.get(label, {})
                  needed_desc = info.get('description', '')
                  if needed_desc and existing.get('description') != needed_desc:
                      print(f"🔄 Updating description for {label}: '{existing.get('description')}' -> '{needed_desc}'")
                      subprocess.run(['gh', 'api', '-X', 'PATCH', f'/repos/{repo}/labels/{label}',
                                      '-f', f'description={needed_desc}'], check=True)
                  else:
                      print(f"✔️ Label already exists and description is correct: {label}")

          print("\n🎉 All done!")
          EOF
