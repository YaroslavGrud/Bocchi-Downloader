name: Create missing Dependabot labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/dependabot.yml'

permissions:
  contents: read
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Create missing labels from dependabot.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          import yaml, subprocess, sys, os

          config_path = '.github/dependabot.yml'
          if not os.path.exists(config_path):
              print(f"File {config_path} not found. Exiting.")
              sys.exit(0)

          with open(config_path, 'r') as f:
              config = yaml.safe_load(f)

          labels = set()
          for update in config.get('updates', []):
              for label in update.get('labels', []):
                  labels.add(label.strip())

          if not labels:
              print("No labels found in dependabot.yml")
              sys.exit(0)

          print(f"Labels to create: {labels}")

          for label in labels:
              result = subprocess.run(
                  ['gh', 'api', f'/repos/{REPO}/labels/{label}'],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  print(f"Creating label: {label}")
                  subprocess.run(
                      ['gh', 'api', f'/repos/{REPO}/labels',
                       '-f', f'name={label}',
                       '-f', 'color=ededed',
                       '-f', 'description=Auto-created from Dependabot config'],
                      check=True
                  )
              else:
                  print(f"Label already exists: {label}")
          print("Done!")
        shell: python
