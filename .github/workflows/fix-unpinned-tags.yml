name: "Закрепить SHA во всех workflow"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Замена тегов на SHA
        id: pin
        shell: bash
        run: |
          python3 << 'PYEOF'
          import os, re, subprocess

          workflows_dir = ".github/workflows"
          changed = False
          files = []
          for root, dirs, filenames in os.walk(workflows_dir):
              for f in filenames:
                  if f.endswith(('.yml', '.yaml')):
                      files.append(os.path.join(root, f))

          for filepath in files:
              with open(filepath, "r") as f:
                  content = f.read()

              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  # Ищем uses: owner/repo@tag (или owner/repo/subpath@tag)
                  m = re.match(r"^(.*uses:\s+)([^@\s]+)@([^@\s]+)(\s*.*)$", line)
                  if m:
                      prefix, action, tag, suffix = m.groups()
                      # Если тег уже является SHA (40 hex), пропускаем
                      if re.fullmatch(r"[a-f0-9]{40}", tag):
                          new_lines.append(line)
                          continue
                      # Извлекаем только владельца и репозиторий (первые две части)
                      parts = action.split('/')
                      repo = '/'.join(parts[:2]) if len(parts) >= 2 else action
                      repo_url = f"https://github.com/{repo}.git"
                      try:
                          result = subprocess.run(["git", "ls-remote", repo_url, tag],
                                                  capture_output=True, text=True, check=True)
                          sha = result.stdout.split()[0] if result.stdout.strip() else None
                      except Exception as e:
                          # Для отладки (можно убрать)
                          print(f"Ошибка при получении SHA для {action}@{tag}: {e}")
                          sha = None
                      if sha:
                          new_line = f"{prefix}{action}@{sha}{suffix}"
                          new_lines.append(new_line)
                          print(f"Заменён {action}@{tag} -> {sha} в {filepath}")
                          changed = True
                      else:
                          new_lines.append(line)
                          print(f"Не удалось получить SHA для {action}@{tag} в {filepath}")
                  else:
                      new_lines.append(line)

              new_content = "\n".join(new_lines)
              if new_content != content:
                  with open(filepath, "w") as f:
                      f.write(new_content)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fout:
              fout.write(f"changed={'true' if changed else 'false'}\n")
          PYEOF

      - name: Создать Pull Request (если были изменения)
        if: steps.pin.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: "🔒 Закрепить SHA во всех Action-ах"
          title: "🔒 Автоматическая привязка SHA"
          body: |
            Все непривязанные теги (`@v...`) заменены на актуальные SHA коммитов.
            Это устраняет предупреждения Semgrep о неиммутабельных действиях.
          branch: fix/unpin-action-tags
          delete-branch: true
          token: ${{ secrets.PAT_TOKEN }}   # ← замените на свой PAT (или используйте GITHUB_TOKEN, если хватает прав)
