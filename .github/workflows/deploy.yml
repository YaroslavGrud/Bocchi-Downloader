name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:   # позволяет запускать вручную

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: yaroslavgrud/bocchi-downloader-server-edition:latest

      - name: Docker Scout security scan
        uses: docker/scout-action@4bbf17a9da65a7b5497361bb407e88cc9548f69c
        with:
          command: cves
          image: yaroslavgrud/bocchi-downloader-server-edition:latest
          exit-code: false