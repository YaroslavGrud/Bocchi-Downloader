name: 🤖 Copilot Autofix – Собрать готовые исправления в 1 PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write   # необходимо для создания autofix-коммита

jobs:
  collect-autofix-to-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_BRANCH: Yaroslav_grud   # замените на имя вашей основной ветки, если не main

    steps:
      - name: 1. Получить список алертов с готовым Autofix
        id: list_alerts
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = await github.paginate(
              'GET /repos/{owner}/{repo}/code-scanning/alerts',
              { owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', tool_name: 'CodeQL', per_page: 100 }
            );

            const ready = alerts.filter(a => a.autofix?.status === 'generated');

            console.log(`Найдено ${ready.length} алертов с готовым Autofix`);
            core.exportVariable('READY_ALERTS', ready.map(a => a.number).join(','));

      - name: 2. Создать ветки с исправлениями (API + ручной fallback)
        id: create_branches
        if: env.READY_ALERTS
        uses: actions/github-script@v7
        timeout-minutes: 15
        with:
          script: |
            const numbers = process.env.READY_ALERTS.split(',');
            const branches = [];
            const { execSync } = require('child_process');
            const repoUrl = `https://x-access-token:${process.env.GITHUB_TOKEN}@github.com/${context.repo.owner}/${context.repo.repo}.git`;
            
            execSync('git config --global user.email "actions@github.com"');
            execSync('git config --global user.name "GitHub Actions"');
            execSync(`git clone ${repoUrl} repo`);
            process.chdir('repo');
            const baseBranch = process.env.BASE_BRANCH || 'main';
            execSync(`git checkout ${baseBranch}`);

            for (const num of numbers) {
              console.log(`\n=== Обработка алерта #${num} ===`);
              let branchName = null;
              
              // Попытка через API (кнопка «Commit to new branch»)
              try {
                const response = await github.request(
                  'POST /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix/commits',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    alert_number: parseInt(num),
                  }
                );
                console.log(`HTTP ${response.status}`);
                console.log(`Response: ${JSON.stringify(response.data)}`);
                
                const ref = response.data?.ref 
                         || response.data?.branch 
                         || response.data?.head_ref 
                         || response.data?.commit?.ref;
                
                if (ref) {
                  branchName = ref.replace('refs/heads/', '');
                  console.log(`✅ API создал ветку: ${branchName}`);
                } else {
                  console.warn('⚠️ API не вернул имя ветки, пробуем вручную...');
                }
              } catch (error) {
                console.error(`❌ Ошибка API autofix/commits: ${error.message}`);
              }

              // Ручное создание ветки и коммита из diff
              if (!branchName) {
                try {
                  const fixResp = await github.request(
                    'GET /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix',
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      alert_number: parseInt(num),
                    }
                  );
                  const diff = fixResp.data?.fix?.diff;
                  console.log(`Diff из GET /autofix: ${diff ? 'найден' : 'отсутствует'}`);
                  
                  if (diff && diff.trim().length > 0) {
                    const tempBranch = `autofix/alert-${num}-${Date.now()}`;
                    execSync(`git checkout -b ${tempBranch} ${baseBranch}`);
                    execSync('git apply -', { input: diff });
                    execSync('git add -A');
                    execSync(`git commit -m "Autofix for alert #${num}"`);
                    execSync(`git push origin ${tempBranch}`);
                    branchName = tempBranch;
                    console.log(`✅ Ручной коммит в ветку: ${branchName}`);
                  } else {
                    console.warn(`⚠️ Нет diff для алерта #${num}, пропускаем.`);
                  }
                } catch (err) {
                  console.error(`❌ Ошибка ручного создания: ${err.message}`);
                }
              }

              if (branchName) {
                branches.push(branchName);
              }
              
              // Задержка, чтобы не превысить лимит API
              await new Promise(resolve => setTimeout(resolve, 12000));
            }

            if (branches.length === 0) {
              console.log('\nНе создано ни одной ветки — выходим');
            } else {
              console.log(`\n✅ Создано веток: ${branches.length}`);
              core.exportVariable('FIX_BRANCHES', branches.join(','));
              core.exportVariable('FIX_COUNT', branches.length.toString());
            }

      - name: 3. Объединить все ветки в одну общую
        id: merge_branches
        if: env.FIX_BRANCHES
        uses: actions/github-script@v7
        with:
          script: |
            const fixBranches = process.env.FIX_BRANCHES.split(',');
            if (fixBranches.length === 0) {
              console.log('Нет веток для мержа');
              return;
            }
            
            const { execSync } = require('child_process');
            const repoUrl = `https://x-access-token:${process.env.GITHUB_TOKEN}@github.com/${context.repo.owner}/${context.repo.repo}.git`;
            execSync('git config --global user.email "actions@github.com"');
            execSync('git config --global user.name "GitHub Actions"');
            
            const base = process.env.BASE_BRANCH || 'main';
            const mergeBranch = `autofix/combined-${Date.now()}`;
            
            execSync(`git clone ${repoUrl} repo`);
            process.chdir('repo');
            execSync(`git checkout ${base}`);
            execSync(`git checkout -b ${mergeBranch}`);
            
            for (const branch of fixBranches) {
              console.log(`Мержим ${branch}...`);
              try {
                execSync(`git merge origin/${branch} --no-ff -m "Merge autofix ${branch}"`);
              } catch (err) {
                console.error(`Конфликт при мерже ${branch}: ${err.message}`);
                execSync('git merge --abort');
              }
            }
            
            execSync(`git push origin ${mergeBranch}`);
            core.exportVariable('MERGE_BRANCH', mergeBranch);

      - name: 4. Создать Pull Request
        id: create_pr
        if: env.MERGE_BRANCH
        uses: actions/github-script@v7
        with:
          script: |
            const count = process.env.FIX_COUNT || '0';
            const pr = await github.request('POST /repos/{owner}/{repo}/pulls', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Copilot Autofix: ${count} исправлений одним PR`,
              head: process.env.MERGE_BRANCH,
              base: process.env.BASE_BRANCH || 'main',
              body: `Объединены автоподстановки для ${count} алертов.\n\nВетки исправлений: ${process.env.FIX_BRANCHES}`,
            });
            console.log(`✅ PR создан: ${pr.data.html_url}`);

      - name: 5. (Опционально) Удалить временные ветки
        if: always() && env.FIX_BRANCHES
        uses: actions/github-script@v7
        with:
          script: |
            const branches = process.env.FIX_BRANCHES.split(',');
            for (const b of branches) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/git/refs/heads/{branch}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: b,
                });
                console.log(`Удалена ветка ${b}`);
              } catch (e) {
                console.warn(`Не удалось удалить ${b}: ${e.message}`);
              }
            }
