version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:                         # <-- Добавлено
      default-days: 7                 # ждём 7 дней перед созданием PR для новых версий
    open-pull-requests-limit: 10
    groups:
      python-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:                         # <-- Добавлено
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:                         # <-- Добавлено
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
