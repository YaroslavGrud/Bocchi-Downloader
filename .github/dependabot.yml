version: 2
updates:
  # Python зависимости (requirements.txt / Pipfile)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"          # проверка каждый день
      time: "06:00"              # UTC время
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"               # для быстрой фильтрации
    commit-message:
      prefix: "deps(pip)"

  # JavaScript зависимости (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(npm)"

  # GitHub Actions (ваши workflow-файлы)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"

  # Docker (если есть Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
